name: Traffic Snapshot

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily (GitHub traffic API resets on UTC day)
  workflow_dispatch:       # allow manual runs

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot / org traffic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture traffic and update gist
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
          GIST_ID: ${{ secrets.TRAFFIC_GIST_ID }}
        run: |
          set -euo pipefail

          TODAY=$(date -u +%Y-%m-%d)
          echo "Capturing traffic snapshot for $TODAY..."

          # All public repos in the org
          REPOS=$(gh repo list project-minigraf \
            --no-archived --json name --limit 100 \
            --jq '.[].name')

          # Build today's snapshot object
          SNAPSHOT=$(jq -n --arg date "$TODAY" '{captured_at: $date, repos: {}}')

          # Fetch one traffic endpoint. The traffic endpoints require push
          # access, so a failure must not abort the whole run. On failure,
          # print a warning with the API error and return the fallback value.
          # NOTE: || must be outside $() so the fallback overwrites rather than
          # appending to the captured stdout (which would produce invalid JSON).
          fetch_traffic() {
            local repo=$1 endpoint=$2 fallback=$3 out err
            err=$(mktemp)
            out=$(gh api "repos/project-minigraf/$repo/traffic/$endpoint" 2>"$err") \
              || { echo "::warning::$repo traffic/$endpoint failed, using fallback $fallback: $(tr '\n' ' ' < "$err")" >&2
                   out=$fallback; }
            rm -f "$err"
            echo "$out"
          }

          for REPO in $REPOS; do
            echo "  → $REPO"

            REFERRERS=$(fetch_traffic "$REPO" popular/referrers '[]')
            VIEWS=$(fetch_traffic "$REPO" views '{"count":0,"uniques":0,"views":[]}')
            CLONES=$(fetch_traffic "$REPO" clones '{"count":0,"uniques":0,"clones":[]}')
            PATHS=$(fetch_traffic "$REPO" popular/paths '[]')
            echo "    referrers=$(echo "$REFERRERS" | jq length) views=$(echo "$VIEWS" | jq .count) clones=$(echo "$CLONES" | jq .count) paths=$(echo "$PATHS" | jq length)"

            SNAPSHOT=$(echo "$SNAPSHOT" | jq \
              --arg repo "$REPO" \
              --argjson referrers "$REFERRERS" \
              --argjson views "$VIEWS" \
              --argjson clones "$CLONES" \
              --argjson paths "$PATHS" \
              '.repos[$repo] = {
                referrers: $referrers,
                views: $views,
                clones: $clones,
                paths: $paths
              }')
          done

          # Fetch existing gist content (JSON array); start fresh if missing or malformed
          EXISTING=$(gh api "gists/$GIST_ID" \
            --jq '.files["traffic.json"].content // "[]"' \
            2>/dev/null) || EXISTING='[]'

          if ! echo "$EXISTING" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "  ⚠ Existing gist content is not a JSON array — starting fresh."
            EXISTING='[]'
          fi

          # Drop any same-day entry so re-runs are idempotent, then append today
          UPDATED=$(echo "$EXISTING" | jq \
            --arg date "$TODAY" \
            --argjson snapshot "$SNAPSHOT" \
            '[.[] | select(.captured_at != $date)] + [$snapshot]')

          # Push updated array back to the gist
          # Write to a temp file first to avoid "Argument list too long" when
          # the accumulated JSON exceeds the OS shell-argument size limit.
          UPDATED_FILE=$(mktemp)
          echo "$UPDATED" > "$UPDATED_FILE"
          jq -n --rawfile content "$UPDATED_FILE" \
            '{"files": {"traffic.json": {"content": $content}}}' | \
            gh api --method PATCH "gists/$GIST_ID" --input -
          rm -f "$UPDATED_FILE"

          ENTRY_COUNT=$(echo "$UPDATED" | jq 'length')
          echo "Done. Gist now holds $ENTRY_COUNT daily snapshot(s)."
